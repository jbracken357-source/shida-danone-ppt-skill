<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>02 Value Summary</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/tokens.css">
<style>
  .top { display: grid; grid-template-columns: .9fr 1.1fr; gap: 56px; align-items: end; }
  .summary-grid { margin-top: 44px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
  .card h3 { font-size: 23px; line-height: 1.2; color: var(--dn-blue-dark); }
  .card p { margin-top: 14px; font-size: 18px; line-height: 1.35; color: var(--dn-text-secondary); }
</style>
</head>
<body class="pptx-canvas">
<main class="slide">
  <div class="top">
    <div>
      <p class="eyebrow">Executive summary</p>
      <h2 class="title">价值不只是更快出片</h2>
    </div>
    <p class="body-copy">企业级 skill 的核心价值，是把「能生成」升级为「可治理、可交付、可复用」。</p>
  </div>
  <div class="summary-grid">
    <div class="card">
      <p class="metric">3x</p>
      <h3>减少重复劳动</h3>
      <p>将模板搭建、版式选择、导出命令和验收清单沉淀为流程。</p>
    </div>
    <div class="card">
      <p class="metric">1 set</p>
      <h3>统一品牌标准</h3>
      <p>颜色、字体、组件、禁用项被写入规则，减少个人风格漂移。</p>
    </div>
    <div class="card">
      <p class="metric">0 gap</p>
      <h3>闭环交付验证</h3>
      <p>HTML、PDF、PPTX、截图抽查连成一条可复现的质量链路。</p>
    </div>
  </div>
  <div class="footer">
    <p>Value summary</p>
    <p>02 / 08</p>
  </div>
</main>
</body>
</html>
