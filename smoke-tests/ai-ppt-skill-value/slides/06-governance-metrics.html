<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>06 Governance Metrics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/tokens.css">
<style>
  .layout { display: grid; grid-template-columns: .82fr 1.18fr; gap: 48px; align-items: start; }
  .table { margin-top: 28px; }
  .insight { margin-top: 28px; }
  .insight h3 { font-size: 25px; color: var(--dn-blue-dark); }
  .insight p { margin-top: 12px; font-size: 19px; line-height: 1.36; color: var(--dn-text-secondary); }
</style>
</head>
<body class="pptx-canvas">
<main class="slide">
  <div class="layout">
    <div>
      <p class="eyebrow">Governance</p>
      <h2 class="title">价值需要被度量，而不是停留在感受</h2>
      <div class="insight tint-card">
        <h3>建议从四类指标验收</h3>
        <p>效率、品牌一致性、交付稳定性、知识复用率共同决定企业级 skill 是否值得规模化。</p>
      </div>
    </div>
    <div>
      <div class="table">
        <div class="cell head-cell"><p>指标类别</p></div>
        <div class="cell head-cell"><p>衡量方式</p></div>
        <div class="cell head-cell"><p>质量门</p></div>
        <div class="cell head-cell"><p>业务意义</p></div>
        <div class="cell"><p>效率</p></div>
        <div class="cell"><p>首版产出时间</p></div>
        <div class="cell"><p>小于 1 天</p></div>
        <div class="cell"><p>释放专家时间</p></div>
        <div class="cell"><p>品牌</p></div>
        <div class="cell"><p>规则命中率</p></div>
        <div class="cell"><p>高于 95%</p></div>
        <div class="cell"><p>减少返工</p></div>
        <div class="cell"><p>交付</p></div>
        <div class="cell"><p>导出成功率</p></div>
        <div class="cell"><p>三类产物通过</p></div>
        <div class="cell"><p>降低风险</p></div>
        <div class="cell"><p>复用</p></div>
        <div class="cell"><p>模板调用次数</p></div>
        <div class="cell"><p>持续增长</p></div>
        <div class="cell"><p>沉淀组织能力</p></div>
      </div>
    </div>
  </div>
  <div class="footer">
    <p>Governance metrics</p>
    <p>06 / 08</p>
  </div>
</main>
</body>
</html>
