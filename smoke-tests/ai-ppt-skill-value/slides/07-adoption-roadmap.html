<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>07 Adoption Roadmap</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/tokens.css">
<style>
  .roadmap { margin-top: 42px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
  .phase { min-height: 340px; }
  .phase h3 { font-size: 26px; color: var(--dn-blue-dark); }
  .phase .time { margin-top: 8px; font-size: 18px; font-weight: 600; color: var(--dn-green); }
  .phase ul { margin-top: 24px; }
  .phase li { font-size: 19px; }
</style>
</head>
<body class="pptx-canvas">
<main class="slide">
  <p class="eyebrow">Adoption roadmap</p>
  <h2 class="title" style="width:900px;">先做窄场景可信，再扩展到组织级平台</h2>
  <div class="roadmap">
    <div class="card phase">
      <h3>Phase 1 · 标准化</h3>
      <p class="time">0-4 周</p>
      <ul>
        <li>沉淀品牌 token 与模板 manifest</li>
        <li>建立 6-8 个高频版式</li>
        <li>跑通 PDF 与 PPTX 导出</li>
      </ul>
    </div>
    <div class="card phase">
      <h3>Phase 2 · 产品化</h3>
      <p class="time">1-2 个月</p>
      <ul>
        <li>接入真实业务素材库</li>
        <li>配置叙事模板和校验清单</li>
        <li>加入评审与版本管理</li>
      </ul>
    </div>
    <div class="card phase">
      <h3>Phase 3 · 规模化</h3>
      <p class="time">季度级</p>
      <ul>
        <li>扩展到多品牌和多语言</li>
        <li>引入使用数据与质量指标</li>
        <li>形成企业内容生产标准</li>
      </ul>
    </div>
  </div>
  <div class="footer">
    <p>Adoption roadmap</p>
    <p>07 / 08</p>
  </div>
</main>
</body>
</html>
