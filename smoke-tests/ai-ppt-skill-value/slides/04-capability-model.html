<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>04 Capability Model</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/tokens.css">
<style>
  .intro { width: 860px; }
  .columns { margin-top: 44px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
  .pillar { min-height: 296px; }
  .pillar h3 { font-size: 23px; line-height: 1.15; color: var(--dn-blue-dark); }
  .pillar p { margin-top: 16px; font-size: 18px; line-height: 1.36; color: var(--dn-text-secondary); }
  .bar { height: 8px; width: 64px; background: var(--dn-blue); margin-bottom: 22px; }
</style>
</head>
<body class="pptx-canvas">
<main class="slide">
  <div class="intro">
    <p class="eyebrow">Capability model</p>
    <h2 class="title">一个企业级 PPT skill 是四层能力的封装</h2>
  </div>
  <div class="columns">
    <div class="tint-card pillar">
      <div class="bar"></div>
      <h3>品牌系统</h3>
      <p>字体、色彩、母版、组件签名、禁用设计语言和真实资产采集规则。</p>
    </div>
    <div class="tint-card pillar">
      <div class="bar"></div>
      <h3>叙事系统</h3>
      <p>从主题到节奏规划表，定义封面、摘要、主体、转折和收束。</p>
    </div>
    <div class="tint-card pillar">
      <div class="bar"></div>
      <h3>生产系统</h3>
      <p>多文件 HTML、真实模板映射、PDF 导出和 PPTX 双模式交付。</p>
    </div>
    <div class="tint-card pillar">
      <div class="bar"></div>
      <h3>验证系统</h3>
      <p>截图、控制台、可编辑约束、版式一致性和交付物抽查形成质量门。</p>
    </div>
  </div>
  <div class="footer">
    <p>Capability model</p>
    <p>04 / 08</p>
  </div>
</main>
</body>
</html>
