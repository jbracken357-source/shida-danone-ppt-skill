<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>08 Closing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/tokens.css">
<style>
  .closing { height: 100%; display: grid; grid-template-columns: 1fr 340px; gap: 66px; align-items: center; }
  .quote { font-family: var(--dn-font-display); font-size: 48px; line-height: 1.16; font-weight: 700; color: #fff; }
  .actions { display: grid; gap: 16px; }
  .action { background: #fff; border-radius: 8px; padding: 24px; }
  .action h3 { font-size: 22px; color: var(--dn-blue-dark); }
  .action p { margin-top: 10px; font-size: 17px; line-height: 1.34; color: var(--dn-text-secondary); }
</style>
</head>
<body class="pptx-canvas" style="background:#005EB8;">
<main class="slide slide-blue">
  <div class="closing">
    <div>
      <p class="eyebrow">Takeaway</p>
      <h2 class="quote">企业级 AI PPT skill 的价值，是把经验变成可执行、可验证、可复用的生产能力。</h2>
    </div>
    <div class="actions">
      <div class="action">
        <h3>从一个高频场景开始</h3>
        <p>选择年度汇报、产品发布或 ESG 报告作为首个样板。</p>
      </div>
      <div class="action">
        <h3>把质量门写进流程</h3>
        <p>不要只生成页面，要生成能通过验收的交付物。</p>
      </div>
      <div class="action">
        <h3>沉淀组织资产</h3>
        <p>让每次项目都反哺模板、规则、素材和评审标准。</p>
      </div>
    </div>
  </div>
  <div class="footer">
    <p>Closing</p>
    <p>08 / 08</p>
  </div>
</main>
</body>
</html>
